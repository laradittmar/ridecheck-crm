# docker-compose.beta.yml — Closed-beta backend override for M20 vehicle catalog validation.
#
# Usage (always run from /opt/ridecheck-crm/ so .env is auto-loaded):
#
#   PREFLIGHT (outbound off):
#     cd /opt/ridecheck-crm
#     docker compose -f docker-compose.yml \
#                    -f /opt/ridecheck-crm-release-candidate/docker-compose.beta.yml \
#                    up -d --force-recreate backend
#     docker compose up -d --force-recreate n8n
#
#   LIVE ACTIVATION (outbound on — only after APPROVE_D4V_R_LIVE):
#     cd /opt/ridecheck-crm
#     BETA_OUTBOUND_ENABLED=true \
#     docker compose -f docker-compose.yml \
#                    -f /opt/ridecheck-crm-release-candidate/docker-compose.beta.yml \
#                    up -d --force-recreate backend
#
#   SHUTDOWN (outbound off):
#     cd /opt/ridecheck-crm
#     docker compose -f docker-compose.yml \
#                    -f /opt/ridecheck-crm-release-candidate/docker-compose.beta.yml \
#                    up -d --force-recreate backend
#     docker compose stop n8n
#
# What this override does:
#   - Pins backend to the validated RC image (never triggers a build)
#   - Redirects DATABASE_URL to crm_test (never touches production crm)
#   - Sets OUTBOUND_ENABLED=false by default (BETA_OUTBOUND_ENABLED=true required for live)
#   - Restricts allowlist to the single closed-beta tester suffix ...8330
#   - OPENAI_API_KEY and other secrets are inherited from base compose + /opt/ridecheck-crm/.env

services:
  backend:
    image: ridecheck-crm-backend:l4.7c2-fieldauth-7d61c40
    # L4.3 Phase G: steady state measured 2026-09-01 — backend 116 MiB, n8n 326 MiB,
    # postgres 93 MiB on a 3.8 GiB host. Limits are ~3-8x steady state: they contain a
    # runaway container instead of letting it trigger a HOST-wide OOM that picks an
    # arbitrary victim (INFRA-OOM-01 killed n8n, the sole inbound transport).
    mem_limit: 1g
    mem_reservation: 256m
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://crm:crm@postgres:5432/crm_test
      OUTBOUND_ENABLED: "${BETA_OUTBOUND_ENABLED:-false}"
      CLOSED_BETA_ALLOWED_WA_IDS: "5491153368330"
      QUARANTINED_TEST_WA_IDS: ""
      INTERNAL_BOOKING_EMAIL_TO: "ridecheckassistance@gmail.com"
      INTERNAL_BOOKING_EMAIL_REPLY_TO: "ridecheckassistance@gmail.com"
      FLOW_BOOKING_PRIVATE_KEY_PATH: /run/secrets/flow_booking_private.pem
      SMTP_PASSWORD: ""
      # L4.7B: shadow UNDERSTAND — crm_test ONLY, never production. Proposes TurnEvidence
      # in parallel with the live path and mutates nothing.
      SHADOW_UNDERSTAND_ENABLED: "true"
      SHADOW_UNDERSTAND_ASYNC: "true"   # L4.7B.2: model call off the customer turn
      SHADOW_EVIDENCE_PATH: /run/forensics/shadow_turn_evidence.jsonl
      # L4.7C.2 — first authority cutover, crm_test ONLY. Turning either flag off restores
      # the legacy write path exactly; production must never set these.
      RECONCILER_VEHICLE_AUTHORITY_ENABLED: "true"
      RECONCILER_LOCATION_AUTHORITY_ENABLED: "true"
      # L4.3 Phase C: the published RideCheck Booking Flow is the authoritative
      # booking UX. Pinned explicitly so the runtime never depends on a code default.
      WHATSAPP_BOOKING_FLOW_ID: "28104222025943520"
      # L4.3 Phase F: real deployment attribution in the outbound ledger
      # (was persisted as 'unknown' during Wild A — finding FOR-01).
      GIT_SHA: "${GIT_SHA:-7d61c40}"
    volumes:
      - /opt/ridecheck-secrets:/run/secrets:ro
      - /opt/ridecheck-crm-forensics:/run/forensics

  # L4.3 Phase G — INFRA-OOM-01 hardening.
  # n8n is the SOLE inbound transport: when it dies, customer messages are silently
  # dropped. It must self-heal, and it must not be able to starve the host.
  n8n:
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 384m

  postgres:
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 192m
