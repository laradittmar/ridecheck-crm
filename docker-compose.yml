services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://crm:crm@postgres:5432/crm
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_VERIFY_TOKEN: "ridecheck_whatsapp_verify_2026"
      WHATSAPP_PHONE_NUMBER_ID: "1196075770246218"
      WHATSAPP_APP_SECRET: ""
      N8N_WEBHOOK_URL: "http://n8n:5678/webhook/ridecheck-inbound"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TZ: "America/Argentina/Buenos_Aires"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_USER: "ridecheckassistance@gmail.com"
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: "ridecheckassistance@gmail.com"
      RESEND_API_KEY: ${RESEND_API_KEY}
      INTERNAL_BOOKING_EMAIL_FROM: "notificaciones@ridecheck.ar"
      INTERNAL_BOOKING_EMAIL_TO: ${INTERNAL_BOOKING_EMAIL_TO:-ridecheckassistance@gmail.com}
      INTERNAL_BOOKING_EMAIL_REPLY_TO: ${INTERNAL_BOOKING_EMAIL_REPLY_TO:-ridecheckassistance@gmail.com}
      WHATSAPP_FLOW_ID: "1644218879979041"
      WHATSAPP_WEBSITE_FLOW_ID: "1535038801697863"
      WHATSAPP_VEHICLE_FALLBACK_FLOW_ID: "27205677485784073"
      WHATSAPP_LOCATION_FALLBACK_FLOW_ID: "2550767958730294"
      QUARANTINED_TEST_WA_IDS: ${QUARANTINED_TEST_WA_IDS:-}
      CLOSED_BETA_ALLOWED_WA_IDS: ${CLOSED_BETA_ALLOWED_WA_IDS:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy


  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.ridecheck.ar
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.ridecheck.ar
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - N8N_SECURE_COOKIE=true

    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  n8n_data:



